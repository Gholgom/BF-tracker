<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BF-Preistracker</title>
<style>
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --fg: #1d1d1b; --muted: #6b6a66; --line: #e3e1da;
    --accent: #2f6f5e; --up: #2e7d4f; --down: #b3412f; --grid: #ecebe6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1b1a; --panel: #252523; --fg: #ecebe6; --muted: #a3a29c; --line: #3a3936;
      --accent: #6cc1a6; --up: #6cc18a; --down: #e2826f; --grid: #33322f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 28px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 1.9rem; margin: 0; }
  .lead { color: var(--muted); margin: 6px 0 0; }
  nav { display: flex; gap: 8px; flex-wrap: wrap; }
  nav button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  nav button[aria-selected="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  section { display: grid; gap: 16px; }
  section[hidden] { display: none; }
  h2 { font-family: Georgia, serif; font-weight: 400; font-size: 1.5rem; margin: 0; }
  h3 { font-size: 1rem; font-weight: 600; margin: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .note { color: var(--muted); font-size: .85rem; margin: 4px 0 12px; }
  dl.meta { display: grid; gap: 4px; margin: 0; font-size: .9rem; }
  dl.meta div { display: flex; gap: 10px; }
  dl.meta dt { color: var(--muted); min-width: 5.5em; }
  dl.meta dd { margin: 0; }
  .kgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px; }
  .k h3 { font-size: .8rem; color: var(--muted); font-weight: 500; }
  .k .big { font-family: Georgia, serif; font-size: 1.6rem; margin: 6px 0 0; font-variant-numeric: tabular-nums; }
  .k .big small { font-family: system-ui, sans-serif; font-size: .8rem; color: var(--muted); }
  .k .sub { color: var(--muted); font-size: .8rem; margin: 4px 0 0; }
  .up { color: var(--up); } .down { color: var(--down); }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: .8rem; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; }
  .tip .d { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
  th:nth-child(-n+2), td:nth-child(-n+2) { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: .8rem; }
  .tw { overflow-x: auto; }
  footer { color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>BF-Preistracker</h1>
    <p class="lead">Wöchentliche Schlusskurse ab 16.09.2026, Stichtag jeweils Mittwoch. Stand: <span id="stand"></span></p>
  </header>
  <nav role="tablist" id="tabs"></nav>
  <div id="sections"></div>
  <footer>
    Quelle: Kaack Terminhandel (kaack-terminhandel.de), Chart „Fortlaufend“, Werte aus dem Tooltip abgelesen.
    Kursquellen: Euronext Paris (Weizen), EEX Leipzig (Magermilchpulver). Alle Angaben ohne Gewähr.
  </footer>
</main>

<script>
/* ===== DATEN – nur hier ändern ===== */
const STAND = "29.10.2026";
const PRODUKTE = [
  {
    id: "weizen",
    name: "MATIF-Weizen No. 2",
    boerse: "Euronext Paris",
    dezimalen: 2,
    werte: [
      { kw: 38, datum: "2026-09-16", kurs: 244.50 },
      { kw: 39, datum: "2026-09-23", kurs: 240.50 },
      { kw: 40, datum: "2026-09-30", kurs: 236.00 },
      { kw: 41, datum: "2026-10-07", kurs: 244.25 },
      { kw: 42, datum: "2026-10-14", kurs: 248.25 },
      { kw: 43, datum: "2026-10-21", kurs: 232.75 }
    ]
  },
  {
    id: "mmp",
    name: "EEX-Magermilchpulver",
    boerse: "EEX Leipzig",
    dezimalen: 0,
    werte: [
      { kw: 38, datum: "2026-09-16", kurs: 3214 },
      { kw: 39, datum: "2026-09-23", kurs: 3309 },
      { kw: 40, datum: "2026-09-30", kurs: 3415 },
      { kw: 41, datum: "2026-10-07", kurs: 3525 },
      { kw: 42, datum: "2026-10-14", kurs: 3525 },
      { kw: 43, datum: "2026-10-21", kurs: 3725 },
      { kw: 44, datum: "2026-10-28", kurs: 3685 }
    ]
  }
];
/* ===== ENDE DATEN ===== */

const fmt = (v, d) => new Intl.NumberFormat("de-DE", { minimumFractionDigits: d, maximumFractionDigits: 2 }).format(v);
const fmtD = (s) => s.slice(8, 10) + "." + s.slice(5, 7) + "." + s.slice(0, 4);
const sign = (v, d) => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "±") + fmt(Math.abs(v), d);
const cls = (v) => v > 0 ? "up" : v < 0 ? "down" : "";
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : e.setAttribute(k, v);
  for (const c of kids) e.append(c);
  return e;
};
const NS = "http://www.w3.org/2000/svg";
const s = (tag, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };

function auswerten(werte) {
  const w = [...werte].sort((a, b) => a.kw - b.kw).map((r, i, a) => {
    if (i === 0) return { ...r, diff: null, pct: null };
    const p = a[i - 1].kurs;
    return { ...r, diff: r.kurs - p, pct: (r.kurs - p) / p * 100 };
  });
  const tief = w.reduce((a, b) => b.kurs < a.kurs ? b : a);
  const hoch = w.reduce((a, b) => b.kurs > a.kurs ? b : a);
  const schritte = w.slice(1).map((r, i) => ({ von: w[i].kw, bis: r.kw, pct: r.pct }));
  const an = schritte.reduce((a, b) => b.pct > a.pct ? b : a, schritte[0]);
  const ab = schritte.reduce((a, b) => b.pct < a.pct ? b : a, schritte[0]);
  const avg = w.reduce((t, r) => t + r.kurs, 0) / w.length;
  return { w, tief, hoch, spanne: hoch.kurs - tief.kurs, avg, an, ab };
}

function kachel(titel, wert, einheit, sub, klasse = "") {
  return el("div", { class: "card k" }, el("h3", {}, titel),
    el("p", { class: "big " + klasse }, wert + " ", el("small", {}, einheit)),
    el("p", { class: "sub" }, sub));
}

function chart(box, w, d) {
  box.replaceChildren();
  const W = Math.max(300, box.clientWidth || 600), H = 280;
  const lo = Math.min(...w.map((r) => r.kurs)), hi = Math.max(...w.map((r) => r.kurs));
  const step = hi - lo > 200 ? 100 : hi - lo > 40 ? 10 : 5;
  const pad = Math.max(step, (hi - lo) * 0.15);
  const y0 = Math.floor((lo - pad) / step) * step, y1 = Math.ceil((hi + pad) / step) * step;
  const left = 50, right = 20, top = 24, bottom = 34;
  const X = (i) => left + 10 + i * (W - left - right - 20) / Math.max(1, w.length - 1);
  const Y = (v) => top + (y1 - v) / (y1 - y0) * (H - top - bottom);
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}` });
  const nt = Math.min(6, Math.round((y1 - y0) / step));
  const tstep = Math.ceil((y1 - y0) / step / nt) * step;
  for (let t = y0; t <= y1; t += tstep) {
    svg.append(s("line", { x1: left, x2: W - 6, y1: Y(t), y2: Y(t), stroke: "var(--grid)" }));
    const tx = s("text", { x: left - 6, y: Y(t), "text-anchor": "end", "dominant-baseline": "middle", "font-size": 11, fill: "var(--muted)" });
    tx.textContent = fmt(t, 0); svg.append(tx);
  }
  w.forEach((r, i) => {
    const tx = s("text", { x: X(i), y: H - 10, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
    tx.textContent = "KW " + r.kw; svg.append(tx);
  });
  svg.append(s("polyline", { points: w.map((r, i) => X(i) + "," + Y(r.kurs)).join(" "), fill: "none", stroke: "var(--accent)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  w.forEach((r, i) => {
    svg.append(s("circle", { cx: X(i), cy: Y(r.kurs), r: 4, fill: "var(--accent)" }));
    if (W >= 380) {
      const tx = s("text", { x: X(i), y: Y(r.kurs) - 10, "text-anchor": "middle", "font-size": 11, fill: "var(--fg)" });
      tx.textContent = fmt(r.kurs, d); svg.append(tx);
    }
  });
  box.append(svg);
  const tip = el("div", { class: "tip" }); tip.hidden = true; box.append(tip);
  const show = (ev) => {
    const rect = svg.getBoundingClientRect(), sc = rect.width / W;
    const mx = (ev.clientX - rect.left) / sc;
    let bi = 0; w.forEach((r, i) => { if (Math.abs(X(i) - mx) < Math.abs(X(bi) - mx)) bi = i; });
    const r = w[bi];
    tip.replaceChildren(el("div", { class: "d" }, "KW " + r.kw + " · " + fmtD(r.datum)),
      el("div", {}, fmt(r.kurs, d) + " €/t (" + sign(r.diff, d) + ")"));
    tip.hidden = false;
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(0, X(bi) * sc - tw / 2), box.clientWidth - tw) + "px";
    tip.style.top = Math.max(0, Y(r.kurs) * sc - 58) + "px";
  };
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", () => { tip.hidden = true; });
}

function bauen() {
  document.getElementById("stand").textContent = STAND;
  const tabs = document.getElementById("tabs"), secs = document.getElementById("sections");
  const charts = [];
  PRODUKTE.forEach((p, idx) => {
    const a = auswerten(p.werte), d = p.dezimalen;
    const btn = el("button", { role: "tab", "aria-selected": idx === 0 ? "true" : "false" }, p.name);
    tabs.append(btn);
    const box = el("div", { class: "chart" });
    const tb = el("tbody");
    a.w.forEach((r) => tb.append(el("tr", {},
      el("td", {}, String(r.kw)), el("td", {}, fmtD(r.datum)), el("td", {}, fmt(r.kurs, d)),
      el("td", { class: cls(r.diff) }, sign(r.diff, d)),
      el("td", { class: cls(r.pct) }, r.pct == null ? "–" : sign(Math.round(r.pct * 100) / 100, 2)))));
    const sec = el("section", { id: p.id },
      el("div", { class: "card" },
        el("h2", {}, p.name),
        el("dl", { class: "meta" },
          el("div", {}, el("dt", {}, "Produkt"), el("dd", {}, p.name)),
          el("div", {}, el("dt", {}, "Zeitraum"), el("dd", {}, fmtD(a.w[0].datum) + " – " + fmtD(a.w[a.w.length - 1].datum))),
          el("div", {}, el("dt", {}, "Quelle"), el("dd", {}, "Kaack Terminhandel, Kursquelle " + p.boerse)))),
      el("h3", {}, "1. Rechnerische Auswertung"),
      el("div", { class: "kgrid" },
        kachel("Tiefster Preis", fmt(a.tief.kurs, d), "€/t", "KW " + a.tief.kw),
        kachel("Höchster Preis", fmt(a.hoch.kurs, d), "€/t", "KW " + a.hoch.kw),
        kachel("Preisspanne", fmt(a.spanne, d), "€/t", "höchster − tiefster Preis"),
        kachel("Durchschnittspreis", fmt(Math.round(a.avg * 100) / 100, 2), "€/t", "Mittel aus " + a.w.length + " Stichtagen"),
        kachel("Größter Anstieg", sign(Math.round(a.an.pct * 100) / 100, 2), "%", "von KW " + a.an.von + " bis KW " + a.an.bis, "up"),
        kachel("Größter Rückgang", sign(Math.round(a.ab.pct * 100) / 100, 2), "%", "von KW " + a.ab.von + " bis KW " + a.ab.bis, a.ab.pct < 0 ? "down" : "")),
      el("p", { class: "note" }, "Anstieg und Rückgang: Veränderung von einem Stichtag zum nächsten, in % des Ausgangspreises."),
      el("div", { class: "card" }, el("h3", {}, "Schlusskurs je Stichtag"),
        el("p", { class: "note" }, p.boerse + ", €/t, Stichtag jeweils Mittwoch"), box),
      el("div", { class: "card" }, el("h3", {}, "Tabelle"),
        el("div", { class: "tw" }, el("table", {},
          el("thead", {}, el("tr", {}, el("th", {}, "KW"), el("th", {}, "Datum"), el("th", {}, "Schlusskurs €/t"), el("th", {}, "Veränd. €/t"), el("th", {}, "Veränd. %"))),
          tb))));
    if (idx !== 0) sec.hidden = true;
    secs.append(sec);
    charts.push(() => chart(box, a.w, d));
    btn.addEventListener("click", () => {
      [...tabs.children].forEach((b) => b.setAttribute("aria-selected", b === btn ? "true" : "false"));
      [...secs.children].forEach((x) => x.hidden = x !== sec);
      charts[idx]();
    });
  });
  const redraw = () => charts.forEach((f, i) => { if (!secs.children[i].hidden) f(); });
  redraw();
  let t; window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(redraw, 150); });
}
bauen();
</script>
</body>
</html>
