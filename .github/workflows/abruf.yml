name: Wöchentlicher Kursabruf

on:
  schedule:
    # Mittwochabend nach Börsenschluss (UTC 20:23 = 21:23 Winterzeit / 22:23 Sommerzeit)
    - cron: "23 20 * * 3"
    # Ersatzlauf Donnerstagmorgen, falls der Mittwochslauf ausfällt
    - cron: "23 5 * * 4"
  workflow_dispatch:
  push:
    paths:
      - "tools/abruf.mjs"
      - ".github/workflows/abruf.yml"

permissions:
  contents: write

concurrency:
  group: kursabruf
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright installieren
        run: |
          npm init -y >/dev/null
          npm install playwright@1
          npx playwright install --with-deps chromium
      - name: Kurse abrufen
        run: node tools/abruf.mjs
      - name: Neue Werte speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kurse.json
          if git diff --cached --quiet; then echo "Keine neuen Werte"; exit 0; fi
          git commit -m "Kurse aktualisiert ($(date -u +%Y-%m-%d))"
          git push
