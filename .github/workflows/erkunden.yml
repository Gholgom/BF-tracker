name: Erkundung Kaack-Datenquelle

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/erkunden.mjs"
      - ".github/workflows/erkunden.yml"

permissions:
  contents: write

jobs:
  erkunden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright installieren
        run: |
          npm init -y >/dev/null
          npm install playwright@1
          npx playwright install --with-deps chromium
      - name: Kaack-Seiten erkunden
        run: node tools/erkunden.mjs
      - name: Ergebnis speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug
          git commit -m "Erkundung: Ergebnisse" || echo "nichts zu speichern"
          git push
